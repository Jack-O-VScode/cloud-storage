services:
  cloud-storage:
    build: .
    restart: unless-stopped
    ports:
      - '${HOST_PORT:-3000}:3000'
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - MAX_UPLOAD_BYTES=${MAX_UPLOAD_BYTES:-21474836480}
      - FORCE_HTTPS=${FORCE_HTTPS:-false}
    volumes:
      # Point this at whatever disk/volume should hold uploaded files and
      # metadata (a mounted block volume, a USB drive, etc), not the OS
      # boot partition.
      - ${DATA_DIR:-./data}:/app/server/data
